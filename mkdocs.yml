site_name: ArchGuard
site_description: Architecture conformance checks for Java, TypeScript/JavaScript and Python
site_url: https://dmishra2022.github.io/archguard/
repo_url: https://github.com/dmishra2022/archguard
repo_name: dmishra2022/archguard
edit_uri: edit/main/docs/
copyright: Apache-2.0

docs_dir: docs
strict: true
exclude_docs: |
  kb/
  hooks/
  requirements.txt
  pilots/*/
  architecture.schema.json
hooks:
  - docs/hooks/repo_links.py
validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.superfences:
      custom_fences:
        - { name: mermaid, class: mermaid, format: !!python/name:pymdownx.superfences.fence_code_format }

nav:
  - Home: index.md
  - Get started:
      - Java: getting-started/java.md
      - TypeScript / JavaScript: getting-started/typescript.md
      - Python: getting-started/python.md
  - Guides:
      - Onboarding a project: ONBOARDING.md
      - Adoption playbook: guides/adoption-playbook.md
      - Baselines and suppressions: guides/baselines-and-suppressions.md
      - CI integration: CI.md
      - AI coding agents: guides/ai-agents.md
      - Organisation presets: guides/org-presets.md
  - Concepts:
      - How ArchGuard works: concepts/how-it-works.md
  - Reference:
      - Rules: RULES.md
      - Policy configuration: CONFIGURATION.md
      - Command line (Java): CLI.md
      - Custom rules (Java): CUSTOM_RULES.md
      - SDK architecture: ARCHITECTURE.md
      - Compatibility and versioning: reference/compatibility.md
  - Help:
      - Troubleshooting: troubleshooting.md
      - FAQ: faq.md
      - Getting support: support.md
  - Case studies:
      - Java pilots: pilots/PILOT_REPORT.md
      - TypeScript pilots: pilots/TYPESCRIPT_PILOT.md
      - Python pilots: pilots/PYTHON_PILOT.md
  - Maintainers:
      - Releasing to PyPI and npm: maintainers/releasing.md
