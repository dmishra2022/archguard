[project]
name = "orders-fastapi-violating"
version = "1.0.0"
description = "FastAPI order service with deliberate architecture violations (ArchGuard example)"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.110", "sqlalchemy>=2.0", "pydantic>=2.0"]

[project.optional-dependencies]
test = ["httpx", "pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
