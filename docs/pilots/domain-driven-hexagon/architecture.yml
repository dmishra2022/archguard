schemaVersion: 2
language: typescript
roots: ["src/**"]
profiles: [hexagonal, modular-monolith]
roles:
  DOMAIN: ["src/modules/*/domain/**", "src/libs/ddd"]
contexts:
  - id: user
    packages: ["src/modules/user/**"]
    exposedPackages: ["src/modules/user/domain/events/**"]
  - id: wallet
    packages: ["src/modules/wallet/**"]
    exposedPackages: ["src/modules/wallet/domain/events/**"]
constraints:
  - id: DDH-001
    from: ["src/modules/*/domain/**"]
    forbidden: ["src/modules/*/database/**", "src/modules/*/commands/**", "src/modules/*/queries/**", "slonik"]
    rationale: Domain models must not depend on persistence, use-case handlers or the SQL client
    remediation: Keep domain code free of persistence and application concerns; depend on ports owned by the domain
newOnly: true
