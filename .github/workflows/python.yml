name: python
on:
  push:
    paths: ["python/**", "spec/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["python/**", "spec/**", ".github/workflows/python.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: python/archguard-py
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -q "PyYAML>=5.4" "jsonschema>=4.0"
      - run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/archguard-py
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -q build
      - run: python scripts/copy_spec.py && python -m build
      - name: Install the wheel in a clean venv and run it outside the repository
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install -q dist/*.whl
          cd /tmp
          /tmp/wheel-venv/bin/archguard --version | grep -q "python analyzer"
          /tmp/wheel-venv/bin/archguard rules | grep -q FW-002
          cp -r "$GITHUB_WORKSPACE/examples/python-violating" /tmp/violating
          set +e; /tmp/wheel-venv/bin/archguard check --project /tmp/violating; code=$?; set -e
          test "$code" = 1
      - uses: actions/upload-artifact@v7
        with:
          name: archguard-cli-python
          path: python/archguard-py/dist/
