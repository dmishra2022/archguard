# One contract, three analyzers: the spec catalog validates, the generated skill reference is current,
# every analyzer passes the shared conformance suite, and an organisation preset resolves the same way
# in Java, TypeScript and Python.
name: conformance
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -q "PyYAML>=5.4" "jsonschema>=4.0"
      - name: Spec catalog, schemas and every example, template and pilot policy
        run: python scripts/spec_check.py
      - name: Generated skill reference is current
        run: python scripts/gen_skill_reference.py --check
      - name: Every analyzer and integration declares the same version
        run: python scripts/release_check.py
      - name: Build the analyzers
        run: |
          mvn -B -q -ntp install -DskipTests
          (cd typescript/archguard-ts && npm ci --no-audit --no-fund && npm run build)
      - run: python scripts/conformance.py --language java --engine maven
      - run: python scripts/conformance.py --language java --engine cli
      - run: python scripts/conformance.py --language typescript
      - run: python scripts/conformance.py --language python
      - name: Organisation preset in all three analyzers
        run: python scripts/preset_check.py
