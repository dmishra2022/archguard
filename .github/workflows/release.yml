# Release the analyzers: io.archguard:* to a Maven repository, archguard-cli to an npm registry and
# archguard-cli to a Python package index. Registries are configured per repository (internal ones in
# most organisations), so nothing is published until they are set:
#   variables: MAVEN_REPOSITORY_URL, NPM_REGISTRY_URL, PYPI_REPOSITORY_URL
#   secrets:   MAVEN_USERNAME, MAVEN_PASSWORD, NPM_TOKEN, PYPI_TOKEN
# A tag v<version> builds, verifies and publishes to every configured registry and creates a GitHub
# release. A manual run builds and verifies, and publishes only when `publish` is checked.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the configured registries (otherwise build and verify only)
        type: boolean
        default: false

permissions:
  contents: read

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish == true }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: version
        name: Versions agree (and match the tag)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then python scripts/release_check.py "${GITHUB_REF#refs/tags/}"; else python scripts/release_check.py; fi
          echo "version=$(mvn -B -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"
      - name: Java build and tests
        run: mvn -B -ntp verify
      - name: TypeScript package
        working-directory: typescript/archguard-ts
        run: npm ci --no-audit --no-fund && npm test && npm pack
      - name: Python package
        working-directory: python/archguard-py
        run: |
          python -m pip install -q build "PyYAML>=5.4" "jsonschema>=4.0"
          python -m unittest discover -s tests
          python scripts/copy_spec.py && python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            archguard-cli/target/archguard-cli-*.jar
            typescript/archguard-ts/archguard-cli-*.tgz
            python/archguard-py/dist/*
          if-no-files-found: error

  maven:
    needs: build
    if: vars.MAVEN_REPOSITORY_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: archguard-release
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - if: env.PUBLISH == 'true'
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          REPOSITORY: ${{ vars.MAVEN_REPOSITORY_URL }}
        run: mvn -B -ntp deploy -DskipTests -DaltDeploymentRepository="archguard-release::$REPOSITORY"

  npm:
    needs: build
    if: vars.NPM_REGISTRY_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: ${{ vars.NPM_REGISTRY_URL }}
      - if: env.PUBLISH == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish typescript/archguard-ts/archguard-cli-*.tgz

  pypi:
    needs: build
    if: vars.PYPI_REPOSITORY_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - if: env.PUBLISH == 'true'
        env:
          TWINE_REPOSITORY_URL: ${{ vars.PYPI_REPOSITORY_URL }}
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: python -m pip install -q twine && python -m twine upload --non-interactive python/archguard-py/dist/*

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "ArchGuard ${TAG#v}" --generate-notes \
            archguard-cli/target/archguard-cli-*.jar typescript/archguard-ts/archguard-cli-*.tgz python/archguard-py/dist/*
